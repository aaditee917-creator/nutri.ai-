<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NutriAI</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #eefbf4, #f8fffb); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 400px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10); }
        .logo { text-align: center; font-size: 30px; font-weight: bold; margin-bottom: 8px; color: #16a34a; }
        .subtitle { text-align: center; color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 30px; }
        h2 { text-align: center; margin-bottom: 25px; color: #222; }
        label { display: block; margin-bottom: 7px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 13px; margin-bottom: 18px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
        input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.2); }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #16a34a; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background: #14532d; }
        .error { padding: 12px; border-radius: 8px; margin-bottom: 18px; text-align: center; background: #ffe8e8; color: #b42318; font-size: 14px; }
        .success { padding: 12px; border-radius: 8px; margin-bottom: 18px; text-align: center; background: #e8f8ef; color: #18794e; font-size: 14px; }
        .signup { text-align: center; margin-top: 22px; color: #666; font-size: 14px; }
        .signup a { color: #16a34a; font-weight: bold; text-decoration: none; }
        .signup a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🥗 NutriAI</div>
        <div class="subtitle">AI-Powered Food Recommendation System</div>
        <h2>Welcome Back 👋</h2>
        
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if success %}<div class="success">{{ success }}</div>{% endif %}

        <form method="POST" action="/login">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="submit">🔐 Login</button>
        </form>

        <div class="signup">Don't have an account? <a href="/signup">Sign Up</a></div>
    </div>
</body>
</html>
