<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NutriAI</title>

    <style>
        /* FIXED CSS: Removed undefined variables so your custom hex colors below work perfectly! */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f8ef 0%, #f7fffa 50%, #dff5e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* MAIN CARD */
        .signup-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.96);
            padding: 42px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* LOGO */
        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #238653;
            margin-bottom: 8px;
        }

        .logo-icon { font-size: 34px; }

        /* TEXT */
        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        h2 { text-align: center; color: #222; font-size: 25px; margin-bottom: 8px; }
        
        .welcome {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* ERROR MESSAGE */
        .error {
            background: #fff0f0;
            color: #c62828;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #ffd0d0;
        }

        /* FORM INPUTS */
        label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .input-group { margin-bottom: 19px; }
        
        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d8d8d8;
            border-radius: 11px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #fff;
        }

        input::placeholder { color: #aaa; }
        input:focus { border-color: #35a66f; box-shadow: 0 0 0 3px rgba(53,166,111,0.12); }

        /* BUTTON */
        .signup-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #35a66f, #278755);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 15px rgba(39,135,85,0.20);
        }

        .signup-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(39,135,85,0.28);
        }

        /* LOGIN LINK & FOOTER */
        .login-text { text-align: center; margin-top: 24px; font-size: 14px; color: #777; }
        .login-text a { color: #278755; font-weight: 700; text-decoration: none; margin-left: 4px; }
        .login-text a:hover { text-decoration: underline; }
        .footer { text-align: center; margin-top: 28px; font-size: 12px; color: #aaa; }

        /* MOBILE RESPONSIVE */
        @media (max-width: 480px) {
            .signup-card { width: 100%; padding: 32px 25px; border-radius: 20px; }
            .logo { font-size: 28px; }
            h2 { font-size: 23px; }
        }
    </style>
</head>

<body>
    <div class="signup-card">
        
        <!-- LOGO -->
        <div class="logo">
            <span class="logo-icon">🥗</span> NutriAI
        </div>
        <div class="subtitle">AI-Powered Food Recommendation System</div>

        <!-- TITLE -->
        <h2>Create Your Account</h2>
        <div class="welcome">Start your personalized nutrition journey</div>

        <!-- ERROR MESSAGE (From Flask) -->
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <!-- SIGN UP FORM -->
        <form method="POST" action="/signup">
            
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
            </div>

            <button type="submit" class="signup-btn">✨ Create Account</button>
            
        </form>

        <!-- LOGIN -->
        <div class="login-text">
            Already have an account? 
            <a href="/login">Login</a>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            NutriAI • AI Food Recommendation System
        </div>

    </div>
</body>
</html>
